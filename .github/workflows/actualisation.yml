
name: Verification des archives MonIA

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas

      - name: Verifier les pages officielles
        run: |
          python - <<'PY'
          import requests

          urls = [
              "https://www.fdj.fr/jeux-de-tirage/loto/historique",
              "https://www.fdj.fr/jeux-de-tirage/euromillions-my-million/historique",
          ]

          for url in urls:
              response = requests.get(
                  url,
                  timeout=30,
                  headers={"User-Agent": "MonIA-Statistics/1.0"}
              )
              response.raise_for_status()
              print(f"Page accessible : {url}")
          PY
